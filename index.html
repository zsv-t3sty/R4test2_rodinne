<style>
:root{color-scheme:dark;--bg:#120b10;--bg2:#2a1421;--card:#24171f;--tx:#f6eef2;--mu:#a8929d;--ac:#b83a6b;--ac2:#e58fb0;--ok:#2fa571;--okb:rgba(47,165,113,.14);--ko:#e5695f;--kob:rgba(229,105,95,.15);--bd:rgba(255,255,255,.1);--sh:0 6px 20px rgba(0,0,0,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:14px;font-weight:600}

.intro{padding:28px 20px 22px!important}
.logo{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 12px 28px rgba(184,58,107,.45);animation:float 3s ease-in-out infinite}
.intro h1{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px}

.oa textarea.ok{border-color:var(--ok);background:var(--okb)}.oa textarea.ko{border-color:var(--ko);background:var(--kob)}

.sz{display:block;width:100%;font:700 18px/1.2 'Outfit',system-ui,sans-serif;letter-spacing:.3px;color:var(--tx);border:2px solid;border-radius:18px;padding:20px 12px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.sz:active{transform:scale(.97)}
.sz0{background:rgba(47,165,113,.16);border-color:var(--ok)}
.sz1{background:rgba(217,164,65,.16);border-color:#d9a441}
.sc{background:var(--card);border-radius:18px;padding:22px 18px;margin:12px 0;min-height:96px;display:grid;place-items:center;text-align:center;font-weight:600;font-size:19px;line-height:1.35;box-shadow:var(--sh);touch-action:pan-x;animation:rise .35s both;-webkit-user-select:none;user-select:none}
.sh{text-align:center;color:var(--mu);font-size:14px;margin:4px 0 0}

<script>
const Q=[
["Dítě potřebuje zcela nového rodiče. Která forma náhradní rodinné péče to řeší?",["Osvojení (adopce)", "Poručenství", "Pěstounská péče"],0,"Při osvojení se osvojitel stává plnohodnotným rodičem dítěte, takže dítě získává zcela nového rodiče."],
["Je to rodič a zákonný zástupce najednou (do 18). O kterou formu náhradní rodinné péče jde?",["Poručenství", "Osvojení (adopce)", "Pěstounská péče"],1,"Osvojitel je rodič i zákonný zástupce dítěte. Dítěti přitom zanikají právní vazby na původní biologickou rodinu."],
["Manželé nemohou mít vlastní dítě kvůli neplodnosti. Která forma jim umožní stát se rodiči?",["Ústavní výchova", "Osvojení (adopce)", "Poručenství"],1,"Jen osvojení dělá z osvojitele rodiče i zákonného zástupce dítěte."],
["Oba rodiče dítěte jsou ve vězení a dítě potřebuje někoho, kdo za ně bude právně jednat. Co soud nařídí?",["Osvojení", "Poručenství", "Ústavní výchovu"],1,"Poručenství se využívá, když rodiče nemohou vykonávat odpovědnost na 100 % a dítě potřebuje právního zástupce."],
["Rodiče jsou nesvéprávní, například jim je teprve 16 let. Kdo bude za jejich dítě právně jednat?",["Poručník", "Ani jeden", "Pěstoun"],0,"Nesvéprávní rodiče nemohou odpovědnost vykonávat naplno, a proto za dítě právně jedná poručník."],
["Kdo je poručník?",["Rodič i zákonný zástupce dítěte", "Zákonný zástupce dítěte, ale ne rodič", "Ani zákonný zástupce, ani rodič"],1,"Poručník je zákonným zástupcem a přebírá právní odpovědnost za dítě místo jeho rodičů, rodičem se ale nestává."],
["Dítě má svéprávné rodiče, ale z různých důvodů (problematická rodina, náročná finanční situace rodičů) potřebuje někoho, kdo by ho finančně podporoval. O jakou péči jde?",["Pěstounská péče", "Poručenství", "Osvojení"],0,"Při pěstounské péči rodiče zůstávají rodiči a zákonnými zástupci, dítě ale potřebuje podporu někoho dalšího. Pěstoun má nárok na dávky pěstouna."],
["Kdo rozhoduje o důležitých věcech dítěte u pěstounské péče?",["Pěstoun sám o všem", "Dítě si v těchto případech rozhoduje samo", "Rodiče dítěte"],2,"O důležitých věcech dítěte rozhodují dál rodiče, protože zůstávají rodiči a zákonnými zástupci. Pěstoun není zákonným zástupcem ani rodičem, proto rozhoduje pouze o běžných věcech."],
["Kdo rozhoduje o tom, do kterého zařízení bude dítě při ústavní výchově umístěno?",["Soud", "Škola", "Rodiče dítěte"],0,"Ústavní výchovu nařizuje soud a zároveň určuje zařízení, kam má být dítě umístěno."],
["Matce se nedaří ze svého platu ušetřit nic navíc pro sebe a dítě. Otec si kupuje drahé oblečení a v létě letí na Bali. Může se matka obrátit na soud?",["Ano, může žádat zvýšení výživného", "Ne, otec platí, kolik chce", "Ne, dítě musí požádat samo"],0,"Výživné má odpovídat potřebám dítěte i možnostem a majetkovým poměrům rodiče, a proto může matka žádat soud o zvýšení."],
["Rodiče si nemohou dovolit každodenní stravování a zdravotní péči. Jejich již pracující dítě je nechce finančně podporovat. Může se rodič obrátit na soud?",["Ne, rodiče nemají na dítě žádné právo", "Ne, vyživovací povinnost mají jen rodiče vůči dětem", "Ano, dítě může mít vyživovací povinnost k rodičům"],2,"Vyživovací povinnost platí oběma směry: dospělé děti mohou být povinny podporovat rodiče, kteří jsou v nouzi."],
["Otec každý měsíc v určený den platí alimenty. Matka chce, aby platil alimenty i na druhé, již pracující dítě. Uspěje u soudu?",["Ano, rodič platí na každé dítě bez ohledu na věk", "Ne, dítě, které už pracuje a uživí se, nárok nemá", "Ano, ale jen polovinu částky"],1,"Vyživovací povinnost rodičů trvá jen do doby, kdy je dítě schopné samo se živit. Pracující dítě tedy nárok na výživné nemá."],
["Otec se zpozdil s placením alimentů, matka dítěte se tedy rozhodla, že bude požadovat tento měsíc vyšší částku na výživné. Může to udělat?",["Může, za prodlení se platí pokuta.", "Nemůže, zpozdit se s alimenty je v pořádku a nejde právně vymáhat.", "Nemůže, výživné se nikdy nemění."],0,"Matka může tento měsíc požadovat vyšší částku, protože za prodlení s placením výživného se platí pokuta."],
["Co je podle novely z ledna 2025 trvalý svazek dvou osob stejného pohlaví?",["Manželství", "Partnerství", "Společná domácnost"],1,"Od ledna 2025 se svazek dvou osob stejného pohlaví nazývá jen „partnerství“."],
["Co je podle novely z ledna 2025 součástí společného jmění partnerů?",["Jen to, co nabyl jeden z partnerů před partnerstvím", "Cokoliv, co nabyl jeden nebo oba partneři za trvání partnerství", "Nic, majetek je vždy oddělený"],1,"Do společného jmění patří to, co jeden nebo oba partneři nabyli za trvání partnerství, podobně jako u manželů."],
["Co se stane po smrti jednoho z partnerů podle novely z ledna 2025?",["Pozůstalý partner dědí obdobně jako manžel", "Majetek automaticky připadne státu", "Pozůstalý partner nedědí nic"],0,"Pozůstalý partner dědí obdobně jako manžel, což je jedna ze změn novely."],
["Která z těchto věcí JE podmínkou pro uzavření manželství v ČR?",["Oba snoubenci musí mít české občanství.", "Snoubenci musí být osoby stejného pohlaví.", "Oba snoubenci musí být svobodní, rozvedení nebo ovdovělí."],2,"Manželství může uzavřít jen ten, kdo už není v jiném manželství. České občanství se nevyžaduje a manželství v ČR uzavírají muž a žena (stejnopohlavní páry mají partnerství)."],
["Jiří a Vendula se chtějí rozvést. Jejich dcera Anežka (19) rozvod zásadně odmítá, oba rodiče s ním souhlasí. Co to znamená pro rozvod?",["Soud rozvod zamítne, protože dítě nesouhlasí", "Rozvod musí počkat, až bude Anežce 21 let", "Nic, děti jsou plnoleté, jejich nesouhlas rozvod nezastaví"],2,"Anežka je plnoletá a rozhodnutí o rozvodu je věcí manželů. Pokud je manželství hluboce a trvale rozvráceno a oba souhlasí, soud rozvede."],
["Za jakých podmínek by soud rozvod manželů zamítl?",["Pokud by manželství nebylo hluboce a trvale rozvráceno", "Pokud by jeden z manželů s rozvodem nesouhlasil", "Pokud by jeden z manželů vlastnil chatu"],0,"Soud rozvede manželství, které je hluboce a trvale rozvráceno a nelze očekávat obnovení manželského soužití."],
["Manželé Jiří a Vendula se rozvádějí. Jiří koupil za manželství auto za 2 mil. Kč, Vendula chatu za 10 mil. Kč. Kolik z majetku dostane každý z nich, když soud dělí majetek v obvyklém poměru?",["Jiří 2 mil. Kč, Vendula 10 mil. Kč", "Každý po 6 mil. Kč", "Jiří 12 mil. Kč, Vendula nic"],1,"Majetek nabytý za manželství patří do společného jmění a běžně se dělí na poloviny, takže každý dostane hodnotu 6 mil. Kč."],
["Klára studuje na VOŠZ Ostrava. Babička od Kláry (její pěstounka) chce Kláře vyzvednout potvrzení o studiu na VOŠ. Referent SZŠ a VOŠZ ho může vydávat pouze zákonným zástupcům. Jak to dopadne?",["Vyzvedne, protože babička je pěstounka.", "Potvrzení o studiu lze vydat rodičům Kláry.", "Ne, potvrzení může dostat jen Klára.", "Ne, z popisu plyne, že jiné osobě než konkrétnímu studentovi se nemůže potvrzení vydat."],2,"Klára studuje VOŠ, takže jí je minimálně 18 let a je plnoletá. Babička (pěstounka) tedy není zákonným zástupcem, a proto potvrzení nezíská. Dostat ho může jen Klára."]
];
const POOL=Q.slice(),PER_TEST=15; // každý žák dostane PER_TEST náhodných otázek z banky
// Reset pro učitele: otevři stránku s #reset na konci adresy – smaže uložený průběh i výsledek v tomto prohlížeči
try{if(location.hash==="#reset"){["sel","done","pending","state"].forEach(k=>localStorage.removeItem("rpt_"+k));history.replaceState(null,"",location.pathname+location.search)}}catch(e){}
function loadSel(){try{const v=JSON.parse(localStorage.getItem("rpt_sel"));
 if(Array.isArray(v)&&v.length===PER_TEST&&new Set(v).size===v.length&&v.every(x=>x>=0&&x<POOL.length))return v}catch(e){}return null}
function setTest(v){try{localStorage.setItem("rpt_sel",JSON.stringify(v))}catch(e){}
 Q.length=0;v.forEach(x=>Q.push(POOL[x]))}
function newTest(){setTest(sh(POOL.map((_,k)=>k)).slice(0,PER_TEST))}
{const sv=loadSel();if(sv)setTest(sv);else newTest()}
// Spojovačka na konci testu: tvrzení se zařazují ke "Partnerství" (0) nebo "Registrované partnerství" (1)
const BONUS=2,NQ=()=>Q.filter(q=>!(q[4]&&q[4].sort)).length,SIDX=()=>Q.findIndex(q=>q[4]&&q[4].sort);
const SORT={t:"🎁 Bonusová spojovačka: zařaď každé tvrzení ke správnému typu svazku. Zvládneš-li všech 12 správně, získáš +2 body navíc. Jinak se nic neděje.",g:["PARTNERSTVÍ","REGISTROVANÉ PARTNERSTVÍ"],items:[
["Lze uzavírat od 1. 1. 2025",0],
["Partneři mohou mít společné jmění obdobně jako manželé",0],
["Po rozvodu se bývalý partner označuje jako „rozvedený/á“",0],
["Současná právní úprava stejnopohlavního svazku",0],
["Nárok na vdovecký/vdovský důchod existuje",0],
["Je možné osvojit dítě druhého partnera (přiosvojení)",0],
["Zavedeno 2006, spíše praktická právní úprava",1],
["Není možné uzavřít církevním obřadem",1],
["Společná adopce ani osvojení dítěte partnera není povoleno",1],
["Ukončení na matrice, soud neřeší",1],
["Poskytuje užší rozsah práv a povinností",1],
["Nevzniká společné jmění (SJM)",1]]};
Q.push([SORT.t,null,null,"Partnerství je současná úprava (od 1. 1. 2025) s širšími právy, registrované partnerství (od 2006) poskytuje užší rozsah práv a povinností.",{sort:SORT}]);
const L="ABCD",QUIZ_TITLE="Rodinné právo",QUIZ_MINUTES=15;
const RESULTS_ENDPOINT="https://script.google.com/macros/s/AKfycbz0hxy637_YimlQQWN85_0TS62Qn-irtzfTMmyQPpZ8HPYXuqG87K92idi6auEJevXJAA/exec";
let openAns="",i=0,sc=0,wrong=[],right=[],order=[],nm="",t0=0,active=false,cheatCount=0,lastCheat=0,isOffline=!navigator.onLine,secondsLeft=QUIZ_MINUTES*60,tI=null,cI=null;
const app=document.getElementById("app");
function sh(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
// ── Uložení průběhu (obnovení stránky nesmí resetovat čas ani postup) ──
let resumeI=0; // index první nezodpovězené otázky
function saveState(){try{localStorage.setItem("rpt_state",JSON.stringify({nm,t0,cc:cheatCount,sl:secondsLeft,at:Date.now(),i:resumeI,sc,wrong,right,openAns}))}catch(e){}}
function restoreState(){try{const s=JSON.parse(localStorage.getItem("rpt_state"));
 if(!s||typeof s.nm!=="string"||!(s.i>=0&&s.i<=Q.length)||!Array.isArray(s.wrong)||!Array.isArray(s.right))return false;
 nm=s.nm;t0=+s.t0||Date.now();cheatCount=s.cc|0;i=resumeI=s.i|0;sc=s.sc|0;wrong=s.wrong;right=s.right;openAns=typeof s.openAns==="string"?s.openAns:"";
 secondsLeft=Math.max(0,Math.round(s.sl-(navigator.onLine?(Date.now()-s.at)/1000:0)));active=true;return true}catch(e){return false}}
// ── Odesílání do Google Sheets ──
function sendResultToServer(p){
 if(!RESULTS_ENDPOINT)return;
 fetch(RESULTS_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)})
  .then(()=>{try{localStorage.removeItem("rpt_pending")}catch(e){}})
  .catch(e=>{console.warn("Odeslání se nezdařilo:",e);try{localStorage.setItem("rpt_pending",JSON.stringify(p))}catch(e2){}});
}
function resendPending(){try{const p=localStorage.getItem("rpt_pending");if(p)sendResultToServer(JSON.parse(p))}catch(e){}}
// ── Ochrana proti kopírování ──
["copy","cut","contextmenu"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
// ── Timer ──
function tick(){const el=document.getElementById("tm");if(!el)return;el.textContent="⏱ "+fmt(secondsLeft);el.className="pill"+(secondsLeft<=60?" danger":secondsLeft<=180?" warn":"")}
function resumeTimer(){tick();clearInterval(tI);tI=setInterval(()=>{secondsLeft=Math.max(0,secondsLeft-1);tick();saveState();if(secondsLeft<=0){stopTimer();timeUp()}},1000)}
function stopTimer(){clearInterval(tI);tI=null}
function timeUp(){clearInterval(cI);document.getElementById("ov").classList.remove("show");end()}
// ── Anti-cheat ──
function kbOpen(){const t=document.activeElement&&document.activeElement.tagName;return t==="INPUT"||t==="TEXTAREA"||t==="SELECT"}
window.addEventListener("offline",()=>{isOffline=true;if(active){document.getElementById("off").classList.add("show");stopTimer()}});
window.addEventListener("online",()=>{isOffline=false;resendPending();document.getElementById("off").classList.remove("show");if(active)resumeTimer()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&active){if(isOffline||kbOpen())return;cheatDetected()}});
window.addEventListener("beforeunload",()=>{if(active&&!isOffline)cheatDetected()});
function ovText(){
 const pn='<span style="color:var(--ko);font-weight:600">−3 min penalizace</span> byla odečtena.';
 document.getElementById("cc").innerHTML=(cheatCount>1?`Toto je již <strong>${cheatCount}. porušení</strong> pravidel. `:"")+pn+`<br>Zbývající čas: <strong id="cl">${fmt(secondsLeft)}</strong>`}
function cheatDetected(){
 const now=Date.now();if(now-lastCheat<2000)return;lastCheat=now;cheatCount++;
 secondsLeft=Math.max(0,secondsLeft-180);tick();saveState();
 ovText();document.getElementById("ov").classList.add("show");
 clearInterval(cI);cI=setInterval(()=>{const l=document.getElementById("cl");if(!l){clearInterval(cI);return}l.textContent=fmt(secondsLeft)},1000);
}
function closeOv(){clearInterval(cI);document.getElementById("ov").classList.remove("show")}
// ── Úvod ──
function intro(){
 app.innerHTML=`<div class="intro"><div class="logo">⚖️</div><h1>${QUIZ_TITLE}</h1><div class="ex" style="margin:4px 0 0">Výživné, náhradní rodinná péče, partnerství a rozvod</div>
 <div class="tiles"><div class="tile" style="--d:0"><b>⏱ ${QUIZ_MINUTES}</b><span>minut na test</span></div><div class="tile" style="--d:1"><b>${NQ()}</b><span>otázek + bonus</span></div><div class="tile w" style="--d:2"><b>−3 min</b><span>za opuštění stránky</span></div></div>
 <input id="ni" placeholder="Jméno a příjmení" autocomplete="name" maxlength="60"><div class="er" id="er"></div>
 <button class="n" id="go" style="animation:none">Začít test →</button><div class="sub">Výsledek se odešle učiteli</div></div>`;
 const ni=document.getElementById("ni");
 ni.onkeydown=e=>{if(e.key==="Enter")begin()};document.getElementById("go").onclick=begin;
}
function begin(){
 const ni=document.getElementById("ni"),v=ni.value.trim();
 if(!v){ni.classList.remove("err");void ni.offsetWidth;ni.classList.add("err");document.getElementById("er").textContent="Zadej své jméno.";ni.focus();return}
 nm=v;i=0;sc=0;wrong=[];right=[];openAns="";cheatCount=0;t0=Date.now();secondsLeft=QUIZ_MINUTES*60;active=true;resumeI=0;saveState();
 ni.blur();show();resumeTimer();
}
function show(){
 if(i>=Q.length)return end();
 const [t,o]=Q[i];if(!o)return (Q[i][4]&&Q[i][4].sort)?showSort():showOpen(t);order=sh(o.map((x,k)=>k));
 app.innerHTML=`<div class="top"><span>${i+1} / ${Q.length}</span><span class="pill" id="tm">⏱ ${fmt(secondsLeft)}</span><span class="pill" id="pl">⭐ ${sc}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${t}</div>`+
 order.map((k,j)=>`<button class="o" style="--d:${j}" data-k="${k}"><b>${L[j]}</b><span>${o[k]}</span></button>`).join("")+`<div id="fb"></div>`;
 app.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 tick();requestAnimationFrame(()=>{app.querySelector(".bar i").style.width=(i+1)/Q.length*100+"%"});
}
function showOpen(t){
 const cfg=Q[i][4];
 app.innerHTML=`<div class="top"><span>${i+1} / ${Q.length}</span><span class="pill" id="tm">⏱ ${fmt(secondsLeft)}</span><span class="pill" id="pl">⭐ ${sc}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${t}</div>
 <div class="oa">`+cfg.f.map((f,k)=>(f.l?`<label>${f.l}</label>`:"")+(f.area?`<textarea id="oa${k}" rows="5" placeholder="${f.p}" maxlength="500"></textarea>`:`<input id="oa${k}" placeholder="${f.p}" maxlength="80" autocomplete="off">`)).join("")+
 `<div class="er" id="oer"></div><button class="n" id="oab" style="animation:none">Potvrdit odpověď</button></div><div id="fb"></div>`;
 tick();requestAnimationFrame(()=>{app.querySelector(".bar i").style.width=(i+1)/Q.length*100+"%"});
 document.getElementById("oab").onclick=pickOpen;
}
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function pickOpen(){
 const cfg=Q[i][4],e=Q[i][3];
 const f=cfg.f.map((_,k)=>document.getElementById("oa"+k)),v=f.map(x=>x.value.trim()),er=document.getElementById("oer");
 if(v.some((x,k)=>x.length<(cfg.f[k].min||3))){er.textContent=f.length>1?"Vyplň všechna pole.":"Napiš alespoň jednu celou větu.";return}
 const n=v.map(nz);
 if(cfg.distinct&&new Set(n).size<n.length){er.textContent="Odpovědi se nesmí opakovat.";return}
 er.textContent="";
 const ok=cfg.f.map((q,k)=>q.r.test(n[k])),hits=ok.filter(Boolean).length,good=hits>=cfg.need;
 openAns+=(openAns?"\n":"")+`[${i+1}] `+cfg.f.map((q,k)=>(q.g?q.g+": ":"")+v[k]).join(" | ")+` → ${hits}/${f.length}`;
 f.forEach((x,k)=>{x.disabled=true;x.classList.add(ok[k]?"ok":"ko")});
 document.getElementById("oab").remove();
 if(good){sc++;right.push(i);const p=document.getElementById("pl");p.textContent="⭐ "+sc;p.classList.add("pop")}else wrong.push(i);
 resumeI=i+1;saveState();
 document.getElementById("fb").innerHTML=`<div class="ex"><strong>${good?"Správně!":"Tentokrát ne."}</strong> ${f.length>1?`Rozpoznáno ${hits} ze ${f.length}. `:""}${e}<br><em>Otevřená odpověď se odešle i učiteli k posouzení.</em></div><button class="n" id="nx">${i+1<Q.length?"Další →":"Výsledek"}</button>`;
 document.getElementById("nx").onclick=()=>{i++;show();scrollTo(0,0)};
}
function pick(k){
 const [,,c,e]=Q[i];const good=k===c;
 app.querySelectorAll(".o").forEach(b=>{b.disabled=true;const v=+b.dataset.k;
  if(v===c){b.classList.add("ok");b.insertAdjacentHTML("beforeend",'<span class="mark">✓</span>')}
  else if(v===k){b.classList.add("ko");b.insertAdjacentHTML("beforeend",'<span class="mark">✕</span>')}
  else b.classList.add("dim")});
 if(good){sc++;right.push(i);const p=document.getElementById("pl");p.textContent="⭐ "+sc;p.classList.add("pop");if(navigator.vibrate)navigator.vibrate(20)}
 else{wrong.push(i);if(navigator.vibrate)navigator.vibrate([30,40,30])}
 resumeI=i+1;saveState();
 document.getElementById("fb").innerHTML=`<div class="ex"><strong>${good?"Správně!":"Tentokrát ne."}</strong> ${e}</div><button class="n" id="nx">${i+1<Q.length?"Další →":"Výsledek"}</button>`;
 document.getElementById("nx").onclick=()=>{i++;show();scrollTo(0,0)};
}
// ── Spojovačka ──
let sOrd=[],sIdx=0,sAns=[];
function showSort(){
 const S=Q[i][4].sort;sOrd=sh(S.items.map((_,k)=>k));sIdx=0;sAns=[];
 app.innerHTML=`<div class="top"><span>🎁 Bonus</span><span class="pill" id="tm">⏱ ${fmt(secondsLeft)}</span><span class="pill" id="pl">⭐ ${sc}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${S.t}</div><div id="sa"></div>`;
 tick();requestAnimationFrame(()=>{app.querySelector(".bar i").style.width=(i+1)/Q.length*100+"%"});
 sRender();
}
function sPick(g){sAns.push(g);sIdx++;if(navigator.vibrate)navigator.vibrate(15);sRender()}
function sRender(){
 const S=Q[i][4].sort,sa=document.getElementById("sa");
 if(sIdx>=sOrd.length)return sFinish();
 sa.innerHTML=`<div class="sh">${sIdx+1} / ${sOrd.length}</div><button class="sz sz0" id="sg0">${S.g[0]}</button><div class="sc" id="scd">${S.items[sOrd[sIdx]][0]}</div><button class="sz sz1" id="sg1">${S.g[1]}</button><div class="sh">Klepni na skupinu, nebo kartu přetáhni nahoru / dolů.</div>`;
 document.getElementById("sg0").onclick=()=>sPick(0);
 document.getElementById("sg1").onclick=()=>sPick(1);
 const c=document.getElementById("scd");let y0=null;
 c.addEventListener("touchstart",e=>{y0=e.touches[0].clientY},{passive:true});
 c.addEventListener("touchend",e=>{if(y0===null)return;const d=e.changedTouches[0].clientY-y0;y0=null;if(d<-50)sPick(0);else if(d>50)sPick(1)},{passive:true});
}
function sFinish(){
 const S=Q[i][4].sort,sa=document.getElementById("sa");
 const bad=sOrd.map((k,x)=>[k,sAns[x]]).filter(([k,g])=>S.items[k][1]!==g);
 const n=S.items.length,hits=n-bad.length,good=hits===n;
 openAns+=(openAns?"\n":"")+`[${i+1}] Spojovačka → ${hits}/${n}`+(bad.length?" (chyby: "+bad.map(([k])=>S.items[k][0]).join("; ")+")":"");
 if(good){sc+=BONUS;right.push(i);const p=document.getElementById("pl");p.textContent="⭐ "+sc;p.classList.add("pop")}
 resumeI=i+1;saveState();
 sa.innerHTML=`<div class="ex"><strong>${good?"Bonus splněn! +"+BONUS+" body 🎉":"Bonus se tentokrát nepodařil, nic se neodečítá."}</strong> Správně zařazeno ${hits} z ${n}.</div>`+
  bad.map(([k])=>`<div class="r"><b>${S.items[k][0]}</b><br>✔ ${S.g[S.items[k][1]]}</div>`).join("")+
  `<button class="n" id="nx">Výsledek</button>`;
 document.getElementById("nx").onclick=()=>{i++;show();scrollTo(0,0)};
}
function sortKey(S){return S.g.map((g,k)=>`<br><b>${g}:</b> `+S.items.filter(x=>x[1]===k).map(x=>x[0]).join("; ")).join("")}
function confetti(){const col=["#b83a6b","#e58fb0","#2fa571","#d9a441","#e5695f"];
 for(let n=0;n<40;n++){const d=document.createElement("i");d.className="c";d.style.left=Math.random()*100+"vw";d.style.background=col[n%5];d.style.animationDelay=Math.random()*.8+"s";d.style.animationDuration=1.8+Math.random()*1.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}}
function end(){
 stopTimer();active=false;closeOv();
 const el=Math.round((Date.now()-t0)/1000),ts=el>=60?Math.floor(el/60)+"m "+el%60+"s":el+"s";
 const bonus=right.includes(SIDX())?BONUS:0,totalWrong=Math.max(0,NQ()-(sc-bonus)); // nezodpovězené (vypršel čas) = chybné
 const p=Math.min(100,Math.round(sc/NQ()*100)),z=p>=81?1:p>=61?2:p>=41?3:p>=21?4:5;
 const r={name:nm,score:sc,bonus,wrong:totalWrong,grade:z,ts,cheatCount,p,openAns,review:Q.map((_,n)=>n).filter(n=>!right.includes(n)&&n!==SIDX())};
 sendResultToServer({topic:QUIZ_TITLE,name:nm,score:sc,wrong:totalWrong,grade:z,duration:ts,cheatCount,openAnswer:openAns});
 try{localStorage.setItem("rpt_done",JSON.stringify(r));localStorage.removeItem("rpt_state")}catch(e){}
 result(r,true);
}
function result(r,fresh){
 const C=2*Math.PI*74,tx=["","Výborně! 🎉","Chvalitebně 👏","Dobře 👍","Dostatečně 💪","Nedostatečně"][r.grade];
 app.innerHTML=`<h1>Známka ${r.grade}</h1><p class="ex" style="text-align:center;margin:4px 0 0">${tx}</p>
 <div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><defs><linearGradient id="g"><stop offset="0" stop-color="#b83a6b"/><stop offset="1" stop-color="#e58fb0"/></linearGradient></defs><circle class="t" cx="85" cy="85" r="74"/><circle class="v" id="rv" cx="85" cy="85" r="74" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><span id="num">0</span></div>
 <p class="ex" style="text-align:center"><strong>${esc(r.name)}</strong><br>${r.score} z ${NQ()} bodů${r.bonus?` (vč. bonusu +${r.bonus})`:""} · čas ${r.ts}<br>Opuštění stránky: <strong style="color:var(--${r.cheatCount?"ko":"ok"})">${r.cheatCount}×</strong></p>`+
 (r.review.length?`<h2 style="font-size:18px;margin:22px 2px 12px">Co jsi měl/a špatně (${r.review.length})</h2>`:"")+(r.review.map((n,x)=>`<div class="r" style="animation-delay:${.1*x+.3}s"><b>${n+1}. ${Q[n][0]}</b><br>✔ ${Q[n][4]&&Q[n][4].sort?"Správné zařazení:"+sortKey(Q[n][4].sort):Q[n][1]?Q[n][1][Q[n][2]]:"Otevřená odpověď"}<br><span class="ex">${Q[n][3]}</span></div>`).join(""));
 requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById("rv").style.strokeDashoffset=C*(1-r.p/100)}));
 const el=document.getElementById("num");let v=0;const iv=setInterval(()=>{v+=Math.max(1,Math.round(r.p/30));if(v>=r.p){v=r.p;clearInterval(iv)}el.textContent=v+" %"},40);
 if(fresh&&r.grade<=2)confetti();
}
// Po obnovení stránky pokračuje rozpracovaný test, nebo se zobrazí uložený výsledek (test nelze opakovat)
function boot(){
try{const sv=localStorage.getItem("rpt_done");if(sv){result(JSON.parse(sv),false);resendPending()}
 else if(restoreState()){if(secondsLeft<=0||i>=Q.length)end();else{show();resumeTimer()}}
 else intro()}catch(e){intro()}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script><div id="off">📶 Výpadek WiFi – test pozastaven, čas se nezapočítává. Připoj se zpět a pokračuj.</div>
<div id="ov"><div class="cb"><h2>Opustil/a jsi test!</h2><p>Přepnul/a jsi na jinou záložku nebo aplikaci. To se považuje za <strong>podvod</strong>. Test stále běží!</p><p id="cc"></p><button class="n" style="animation:none" onclick="closeOv()">Pokračovat v testu</button></div></div>
</body></html>
